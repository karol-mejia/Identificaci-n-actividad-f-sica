<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Inteligente de Actividad Física</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Chart.js para las gráficas si lo estás usando -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header class="header-container">
        <h1>Monitoreo Inteligente de Acelerometría</h1>
        <p>Evaluación de actividad física en adultos mayores</p>
    </header>

    <main class="main-content">
        <!-- Panel de Control para la Exposición -->
        <section class="control-panel" style="background: #f4f6f9; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center;">
            <label for="selectPaciente" style="font-weight: bold; margin-right: 10px;">Seleccionar Paciente (Demo):</label>
            <select id="selectPaciente" onchange="cargarPacienteSeleccionado(this.value)" style="padding: 8px; font-size: 15px; border-radius: 4px; border: 1px solid #ccc;">
                <option value="">-- Elige un paciente para mostrar --</option>
                <!-- Puedes agregar más archivos JSON de tu carpeta json_convertidos -->
                <option value="d1p01M.json">Paciente d1p01M (Masculino)</option>
                <option value="d1p02F.json">Paciente d1p02F (Femenino)</option>
                <option value="d2p01M.json">Paciente d2p01M (S2 - Masculino)</option>
                <option value="d2p02F.json">Paciente d2p02F (S2 - Femenino)</option>
            </select>
        </section>

        <!-- Tarjetas de Resumen -->
        <section class="dashboard-cards">
            <div class="card">
                <h3>ID Paciente</h3>
                <p id="txtId">-</p>
            </div>
            <div class="card">
                <h3>Género</h3>
                <p id="txtGenero">-</p>
            </div>
            <div class="card">
                <h3>Puntuación Total</h3>
                <p id="txtScore">0 pts</p>
            </div>
            <div class="card">
                <h3>Insignia Obtenida</h3>
                <p id="txtBadge">-</p>
            </div>
        </section>

        <!-- Mensaje de Motivación -->
        <section class="motivation-box" style="background: #e8f4fd; padding: 15px; border-left: 5px solid #2196F3; margin: 20px 0; border-radius: 4px;">
            <h3>Mensaje del Sistema</h3>
            <p id="txtMensaje">Selecciona un paciente arriba para ver el análisis en tiempo real.</p>
        </section>

        <!-- Desglose de Actividades -->
        <section class="breakdown-section">
            <h2>Desglose de Actividades</h2>
            <div id="tablaDesglose" style="overflow-x: auto;">
                <!-- Aquí se inyectará dinámicamente la tabla -->
                <p>Sin datos cargados.</p>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
